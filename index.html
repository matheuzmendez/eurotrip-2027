<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}html,body{margin:0}body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Eurotrip 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: placa de estação. Barra de abas fixa no topo, página de cidade em duas colunas (linha do tempo + mapa). */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#E4E9EF; --ink:#0E1A2B; --muted:#53627A; --line:#CFD7E1;
  --accent:#0B6E7F; --accent-soft:#D7ECEF; --accent-ink:#FFFFFF;
  --it:#2E7D50; --ch:#C0321F; --fr:#2A55B8; --gen:#53627A;
  --warn:#9A5B00; --warn-soft:#FBEBCB; --danger:#B3261E; --danger-soft:#F9DEDB; --ok:#1F7A4D; --ok-soft:#D9F0E3;
  --shadow:0 1px 2px rgba(14,26,43,.08),0 6px 18px rgba(14,26,43,.06);
  --font-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --font-b:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1420; --surface:#132031; --surface2:#1A2A3F; --ink:#E7EEF6; --muted:#9BAAC0; --line:#27384F;
  --accent:#4FC3D4; --accent-soft:#12383F; --accent-ink:#06222A;
  --it:#5CC48A; --ch:#F0705D; --fr:#7FA2F5; --gen:#9BAAC0;
  --warn:#F2B552; --warn-soft:#3A2B0E; --danger:#F28B82; --danger-soft:#3E1B18; --ok:#6FD3A0; --ok-soft:#12331F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1420; --surface:#132031; --surface2:#1A2A3F; --ink:#E7EEF6; --muted:#9BAAC0; --line:#27384F;
  --accent:#4FC3D4; --accent-soft:#12383F; --accent-ink:#06222A;
  --it:#5CC48A; --ch:#F0705D; --fr:#7FA2F5; --gen:#9BAAC0;
  --warn:#F2B552; --warn-soft:#3A2B0E; --danger:#F28B82; --danger-soft:#3E1B18; --ok:#6FD3A0; --ok-soft:#12331F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* barra superior */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:8px}
.brand h1{font-size:30px;font-weight:700}
.brand .rng{color:var(--muted);font-size:13px}
.brand .sp{flex:1}
.cd{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 12px;font-family:var(--font-d);font-size:16px;font-weight:600;letter-spacing:.02em}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:0}
.tabs button{border:0;background:none;padding:8px 14px;font-family:var(--font-d);font-size:19px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;letter-spacing:.02em}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs.sub{background:var(--surface2);border-radius:8px 8px 0 0;padding:0 8px}
.tabs.sub button{font-size:16px;padding:7px 12px}
.tabs .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--gen)}
.dot.IT{background:var(--it)}.dot.CH{background:var(--ch)}.dot.FR{background:var(--fr)}

main{padding-top:20px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:22px;margin-bottom:10px}
.sec-t{font-size:26px;margin:0 0 4px}
.sub-t{color:var(--muted);margin-bottom:12px}
.grid{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.dan{background:var(--danger-soft);color:var(--danger)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;text-decoration:none}
.btn:hover{background:var(--accent-soft)}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.btn.solid:hover{filter:brightness(1.1)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}

/* hero das cidades */
.hero{border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow)}
.hero .stripe{height:6px;background:var(--cc,var(--gen))}
.hero-in{padding:18px 20px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
.hero h2{font-size:clamp(40px,7vw,68px);font-weight:700;line-height:.95}
.hero .ctry{font-family:var(--font-d);font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--cc,var(--muted));font-weight:600;margin-bottom:4px}
.hero .tag{margin-top:8px;color:var(--muted);max-width:60ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-content:start}
.fact{background:var(--surface2);border-radius:8px;padding:8px 10px}
.fact b{display:block;font-family:var(--font-d);font-size:20px;font-weight:600;line-height:1.1}
.fact span{font-size:12px;color:var(--muted)}

.daytabs{display:flex;gap:8px;flex-wrap:wrap}
.daytabs button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;text-align:left;min-width:0}
.daytabs button b{display:block;font-family:var(--font-d);font-size:18px;font-weight:600;line-height:1.1}
.daytabs button span{font-size:12px;color:var(--muted)}
.daytabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daytabs button[aria-selected=true] span{color:var(--bg);opacity:.75}

.daygrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px)}
.dayhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.dayhead h3{font-size:28px}

/* linha do tempo */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;position:relative}
.it:hover{border-color:var(--accent)}
.it.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.it.done{opacity:.55}
.it .tm{font-family:var(--font-d);font-size:20px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.it .tm small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.it h4{font-size:19px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it p{color:var(--muted);font-size:14px;margin-top:2px}
.it .tipb{margin-top:6px;background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink)}
.it .tipb.w{background:var(--warn-soft)}
.it .pins{display:inline-flex;gap:3px}
.pinb{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;font-family:var(--font-b)}
.pinb.food{background:var(--warn);color:var(--surface)}
.pinb.go{background:var(--ink);color:var(--bg)}
.pinb.stay{background:var(--cc,var(--gen));color:#fff}
.it .ck{position:absolute;right:10px;top:10px}
.it .ck input{width:18px;height:18px;accent-color:var(--accent)}
.it h4{padding-right:26px}
.tag-bk{cursor:pointer}

/* mapa */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.maptop{display:flex;gap:8px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
.maptop .sp{flex:1}
.mapsvg{display:block;width:100%;height:auto;aspect-ratio:8/6;background:var(--surface2);touch-action:pan-x pan-y;cursor:grab;user-select:none}
.mapsvg:active{cursor:grabbing}
.mapfoot{padding:8px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.mapstats{display:flex;gap:16px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
.mapstats div b{font-family:var(--font-d);font-size:22px;display:block;line-height:1}
.mapstats div span{font-size:12px;color:var(--muted)}
.legs{width:100%;border-collapse:collapse;font-size:13px}
.legs th{font-family:var(--font-d);font-size:14px;text-align:left;color:var(--muted);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line);letter-spacing:.04em}
.legs td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.legs td.num{white-space:nowrap}
.legs tr.on td{background:var(--accent-soft)}
.scroll-x{overflow-x:auto;max-width:100%}

/* abas internas */
.inner{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.inner button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px}
.inner button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tip:last-child{border-bottom:0}
.tip .chip{align-self:start}

/* reservas */
.bk{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.bk .date{font-family:var(--font-d);text-align:center;border-radius:10px;padding:6px 4px;background:var(--surface2);align-self:start}
.bk .date b{display:block;font-size:34px;line-height:1;font-weight:700}
.bk .date span{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.bk.urgent .date{background:var(--danger-soft);color:var(--danger)}
.bk.soon .date{background:var(--warn-soft);color:var(--warn)}
.bk.open .date{background:var(--ok-soft);color:var(--ok)}
.bk.isdone{opacity:.55}
.bk h4{font-size:21px;margin-bottom:2px}
.bk .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.mon{font-family:var(--font-d);font-size:24px;margin:14px 0 8px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.calm h4{font-size:20px;margin-bottom:6px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cg .h{font-size:11px;color:var(--muted)}
.cg button{border:0;background:var(--surface2);border-radius:6px;min-height:34px;padding:2px;font-size:12px;position:relative}
.cg button.e{background:none;pointer-events:none}
.cg button.trip{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cg button.ev{background:var(--warn-soft);color:var(--warn);font-weight:700}
.cg button.ev.pastd{background:var(--ok-soft);color:var(--ok)}
.cg button.sel{outline:2px solid var(--ink)}
.cg button i{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:9px}
.prog{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog>div{height:100%;background:var(--ok);width:0}

/* visão geral */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.sd{border:1px solid var(--line);border-top:5px solid var(--cc);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;min-width:0}
.sd:hover{border-color:var(--accent);border-top-color:var(--cc)}
.sd b{display:block;font-family:var(--font-d);font-size:22px;line-height:1}
.sd .wd{font-size:12px;color:var(--muted)}
.sd .ti{font-size:13px;margin-top:4px;line-height:1.25}
.big{font-family:var(--font-d);font-size:44px;font-weight:700;line-height:1}
.stat span{font-size:13px;color:var(--muted)}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--font-d);font-size:15px;text-align:left;color:var(--muted);padding:6px 10px;border-bottom:2px solid var(--line);letter-spacing:.05em;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.alert{border-left:6px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:12px 14px}
.alert.high{border-left-color:var(--danger);background:var(--danger-soft)}
.alert h4{font-size:20px;margin-bottom:4px}
.cklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.cklist label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.cklist input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent)}
.cklist li.on span{text-decoration:line-through;color:var(--muted)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px;font:inherit}
select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit}
.idea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.idea b{font-family:var(--font-d);font-size:18px;font-weight:600}
.footer{color:var(--muted);font-size:12px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (max-width:900px){
  .daygrid{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .hero-in{grid-template-columns:minmax(0,1fr)}
  .bk{grid-template-columns:62px minmax(0,1fr)}
  .bk .acts{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

// ===== geometria e modos de transporte =====
function hav(a, b){
  const R = 6371, t = Math.PI/180;
  const dl = (b[0]-a[0])*t, dn = (b[1]-a[1])*t;
  const x = Math.sin(dl/2)**2 + Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
const MODES = {
  walk:{n:'A pé', c:'var(--accent)', dash:'7 5'},
  metro:{n:'Metrô', c:'var(--warn)', dash:''},
  bus:{n:'Ônibus', c:'var(--warn)', dash:'2 5'},
  taxi:{n:'Táxi', c:'var(--warn)', dash:'2 5'},
  train:{n:'Trem', c:'var(--ink)', dash:''},
  cable:{n:'Teleférico', c:'var(--fr)', dash:'9 4'}
};
function estMin(mode, km){
  if (mode === 'walk') return Math.round(km*1.3/4.8*60);
  if (mode === 'metro') return Math.round(km*1.25/22*60 + 6);
  if (mode === 'bus' || mode === 'taxi') return Math.round(km*1.3/16*60 + 6);
  return null;
}
function fmtMin(m){
  if (m == null) return '–';
  if (m < 60) return '~' + Math.max(1, m) + ' min';
  return '~' + Math.floor(m/60) + 'h' + pad2(m%60);
}
const ll = p => p[0].toFixed(5) + ',' + p[1].toFixed(5);
function gmapsDir(pts, mode){
  if (pts.length < 2) return 'https://www.google.com/maps/search/?api=1&query=' + ll([pts[0].lat, pts[0].lon]);
  let mid = pts.slice(1, -1);
  if (mid.length > 8){ const step = mid.length/8; mid = Array.from({length:8}, (_, i) => mid[Math.floor(i*step)]); }
  const f = p => ll([p.lat, p.lon]);
  let u = 'https://www.google.com/maps/dir/?api=1&origin=' + f(pts[0]) + '&destination=' + f(pts[pts.length-1]) + '&travelmode=' + mode;
  if (mid.length) u += '&waypoints=' + mid.map(f).join('%7C');
  return u;
}
const gmapsPin = p => 'https://www.google.com/maps/search/?api=1&query=' + ll([p.lat, p.lon]);

// Constrói pontos e trechos de um dia a partir dos itens
function buildDay(day){
  const pts = [], hops = [], itemPins = [];
  day.items.forEach((it, ii) => {
    itemPins[ii] = [];
    (it.p || []).forEach(s => {
      const [key, mode] = s.split(':');
      const pl = P[key]; if (!pl) return;
      const last = pts[pts.length-1];
      if (last && last.key === key){ itemPins[ii].push(pts.length-1); return; }
      pts.push({key, lat:pl[0], lon:pl[1], name:pl[2], type:pl[3], item:ii});
      const idx = pts.length-1;
      itemPins[ii].push(idx);
      if (idx > 0) hops.push({a:idx-1, b:idx, mode:mode || 'walk'});
    });
  });
  hops.forEach(h => {
    h.km = hav([pts[h.a].lat, pts[h.a].lon], [pts[h.b].lat, pts[h.b].lon]);
    h.min = estMin(h.mode, h.km);
  });
  const total = hops.reduce((s,h) => s + h.km, 0);
  const walkKm = hops.filter(h => h.mode === 'walk').reduce((s,h) => s + h.km*1.3, 0);
  const walkMin = hops.filter(h => h.mode === 'walk').reduce((s,h) => s + h.min, 0);
  return {pts, hops, itemPins, total, walkKm, walkMin};
}

// ===== mapa esquemático em SVG, com zoom, arrasto e rótulos de distância =====
function createMap(host, cfg){
  const W = 800, H = 600;
  let vb = {x:0, y:0, w:W, h:H};
  let sel = -1, selHop = -1;
  let showDist = cfg.showDist !== false, showNames = true, showZone = !!cfg.zone, showGrid = true;
  let C = null; // dados de projeção

  host.innerHTML =
    '<div class="maptop">' +
      '<button class="btn ghost" data-m="dist" aria-pressed="' + showDist + '">Distâncias</button>' +
      '<button class="btn ghost" data-m="names" aria-pressed="true">Nomes</button>' +
      (cfg.zone ? '<button class="btn ghost" data-m="zone" aria-pressed="true">Zona do hotel</button>' : '') +
      '<span class="sp"></span>' +
      '<button class="btn ghost" data-m="in" aria-label="Aproximar">+</button>' +
      '<button class="btn ghost" data-m="out" aria-label="Afastar">−</button>' +
      '<button class="btn ghost" data-m="reset">Ajustar</button>' +
    '</div>' +
    '<svg class="mapsvg" viewBox="0 0 800 600" role="img" aria-label="' + esc(cfg.label || 'Mapa esquemático') + '"></svg>' +
    '<div class="mapfoot"></div>';
  const svg = $('svg', host), foot = $('.mapfoot', host);

  function project(){
    const all = [];
    cfg.pts.forEach(p => all.push([p.lat, p.lon]));
    if (cfg.fitBg && cfg.bg){
      const near = cfg.bg.filter(b => !b.far);
      near.forEach(b => all.push([b.lat, b.lon]));
    }
    if (!all.length && cfg.zone) all.push(cfg.zone.c);
    const lat0 = all.reduce((s,p) => s + p[0], 0)/all.length;
    const lon0 = all.reduce((s,p) => s + p[1], 0)/all.length;
    const kx = 111.32*Math.cos(lat0*Math.PI/180), ky = 110.57;
    const toXY = (lat, lon) => [(lon-lon0)*kx, -(lat-lat0)*ky];
    let xs = all.map(p => toXY(p[0], p[1])[0]), ys = all.map(p => toXY(p[0], p[1])[1]);
    if (cfg.zone && showZone){
      const [zx, zy] = toXY(cfg.zone.c[0], cfg.zone.c[1]), r = cfg.zone.r/1000;
      xs.push(zx-r, zx+r); ys.push(zy-r, zy+r);
    }
    let minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
    let dx = Math.max(maxx-minx, 0.5), dy = Math.max(maxy-miny, 0.4);
    const pad = 80;
    const s = Math.min((W-2*pad)/dx, (H-2*pad)/dy);
    const cx = (minx+maxx)/2, cy = (miny+maxy)/2;
    const px = (lat, lon) => { const [x, y] = toXY(lat, lon); return [W/2 + (x-cx)*s, H/2 + (y-cy)*s]; };
    return {s, px, toXY, cx, cy};
  }
  const nice = v => { const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v/e; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10)*e; };

  function draw(){
    C = C || project();
    const k = vb.w/W;
    const out = [];
    const boxes = [];
    const hit = (b) => boxes.some(o => !(b[2] < o[0] || b[0] > o[2] || b[3] < o[1] || b[1] > o[3]));
    // grade
    if (showGrid){
      const stepKm = nice(130/C.s);
      const sp = stepKm*C.s;
      const x0 = Math.floor(((vb.x - W/2)/C.s + C.cx)/stepKm)*stepKm, y0 = Math.floor(((vb.y - H/2)/C.s + C.cy)/stepKm)*stepKm;
      for (let gx = x0; gx < vb.x + vb.w + sp; gx += stepKm){
        const X = W/2 + (gx - C.cx)*C.s;
        out.push('<line x1="' + X + '" y1="' + vb.y + '" x2="' + X + '" y2="' + (vb.y+vb.h) + '" stroke="var(--line)" stroke-width="' + k + '"/>');
        if (out.length > 400) break;
      }
      for (let gy = y0; gy < vb.y + vb.h + sp; gy += stepKm){
        const Y = H/2 + (gy - C.cy)*C.s;
        out.push('<line x1="' + vb.x + '" y1="' + Y + '" x2="' + (vb.x+vb.w) + '" y2="' + Y + '" stroke="var(--line)" stroke-width="' + k + '"/>');
        if (out.length > 800) break;
      }
    }
    // zona do hotel
    if (cfg.zone && showZone){
      const [zx, zy] = C.px(cfg.zone.c[0], cfg.zone.c[1]);
      out.push('<circle cx="' + zx + '" cy="' + zy + '" r="' + (cfg.zone.r/1000*C.s) + '" fill="var(--cc, var(--accent))" fill-opacity=".14" stroke="var(--cc, var(--accent))" stroke-dasharray="' + 6*k + ' ' + 4*k + '" stroke-width="' + 1.5*k + '"/>');
      out.push('<text x="' + zx + '" y="' + (zy - cfg.zone.r/1000*C.s - 6*k) + '" text-anchor="middle" font-size="' + 12*k + '" font-weight="600" fill="var(--cc, var(--accent))" style="paint-order:stroke;stroke:var(--surface2);stroke-width:' + 3*k + 'px">Zona sugerida para dormir</text>');
    }
    const R = 12*k;
    const P2 = cfg.pts.map(p => C.px(p.lat, p.lon));
    // evita pinos sobrepostos exatamente
    P2.forEach((q, i) => { for (let j = 0; j < i; j++){ if (Math.abs(q[0]-P2[j][0]) < 2*k && Math.abs(q[1]-P2[j][1]) < 2*k){ q[0] += 15*k; q[1] -= 15*k; } } });
    // pinos de fundo (ideias)
    (cfg.bg || []).forEach(b => {
      const [x, y] = C.px(b.lat, b.lon);
      if (b.on) return;
      out.push('<g data-bg="' + b.key + '" style="cursor:pointer"><circle cx="' + x + '" cy="' + y + '" r="' + 7*k + '" fill="var(--surface)" stroke="var(--muted)" stroke-width="' + 1.5*k + '"/><title>' + esc(b.name) + ' (toque para adicionar)</title></g>');
      boxes.push([x-7*k, y-7*k, x+7*k, y+7*k]);
    });
    // trechos
    const hopOut = [], lblOut = [];
    (cfg.hops || []).forEach((h, hi) => {
      const A = P2[h.a], B = P2[h.b]; if (!A || !B) return;
      const m = MODES[h.mode] || MODES.walk;
      const on = hi === selHop;
      const dash = h.dash != null ? h.dash : m.dash;
      hopOut.push('<line x1="' + A[0] + '" y1="' + A[1] + '" x2="' + B[0] + '" y2="' + B[1] + '" stroke="' + m.c + '" stroke-width="' + (on ? 4.5 : 2.5)*k + '" stroke-linecap="round"' + (dash ? ' stroke-dasharray="' + dash.split(' ').map(v => v*k).join(' ') + '"' : '') + ' opacity="' + (on ? 1 : .8) + '"/>');
      const dxl = B[0]-A[0], dyl = B[1]-A[1], L = Math.hypot(dxl, dyl);
      if (L > 30*k){
        const ux = dxl/L, uy = dyl/L, ax = A[0] + dxl*.58, ay = A[1] + dyl*.58, sz = 6*k;
        hopOut.push('<path d="M' + (ax+ux*sz) + ' ' + (ay+uy*sz) + ' L' + (ax-ux*sz-uy*sz*.8) + ' ' + (ay-uy*sz+ux*sz*.8) + ' L' + (ax-ux*sz+uy*sz*.8) + ' ' + (ay-uy*sz-ux*sz*.8) + ' Z" fill="' + m.c + '"/>');
      }
      hopOut.push('<line data-hop="' + hi + '" x1="' + A[0] + '" y1="' + A[1] + '" x2="' + B[0] + '" y2="' + B[1] + '" stroke="transparent" stroke-width="' + 16*k + '" style="cursor:pointer"/>');
      h._lbl = {x:(A[0]+B[0])/2, y:(A[1]+B[1])/2, hi, on, L};
    });
    out.push(...hopOut);
    // pinos
    const pinOut = [];
    cfg.pts.forEach((p, i) => {
      const [x, y] = P2[i];
      const on = i === sel;
      const col = p.col || (p.type === 'f' ? 'var(--warn)' : p.type === 'g' ? 'var(--ink)' : p.type === 's' ? 'var(--cc, var(--gen))' : 'var(--accent)');
      const r = (on ? 15 : (p.type === 'c' ? 13 : 11))*k;
      pinOut.push('<g data-pin="' + i + '" style="cursor:pointer">' + (on ? '<circle cx="' + x + '" cy="' + y + '" r="' + r + 7*k + '" fill="' + col + '" fill-opacity=".22"/>' : '') +
        '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + col + '" stroke="var(--surface)" stroke-width="' + 2*k + '"/>' +
        '<text x="' + x + '" y="' + (y + 4.3*k) + '" text-anchor="middle" font-size="' + 12*k + '" font-weight="700" fill="' + (p.type === 'g' || p.col ? 'var(--bg)' : '#fff') + '" style="pointer-events:none">' + (p.n != null ? p.n : i+1) + '</text><title>' + esc(p.name) + '</title></g>');
      boxes.push([x-r, y-r, x+r, y+r]);
    });
    // rótulos de trecho (sem sobreposição)
    const lblSvg = [];
    if (showDist){
      (cfg.hops || []).forEach((h, hi) => {
        const l = h._lbl; if (!l) return;
        const km = hav([cfg.pts[h.a].lat, cfg.pts[h.a].lon], [cfg.pts[h.b].lat, cfg.pts[h.b].lon]);
        const t = h.lab ? km1(km) + ' km · ' + h.lab : (km1(km) + ' km' + (estMin(h.mode, km) != null ? ' · ' + fmtMin(estMin(h.mode, km)) : ''));
        const w = t.length*6.1*k + 12*k, hh = 17*k;
        const b = [l.x-w/2, l.y-hh/2, l.x+w/2, l.y+hh/2];
        if (!l.on && hit(b)) return;
        boxes.push(b);
        lblSvg.push('<g style="pointer-events:none"><rect x="' + b[0] + '" y="' + b[1] + '" width="' + w + '" height="' + hh + '" rx="' + 8*k + '" fill="var(--surface)" stroke="' + (MODES[h.mode] || MODES.walk).c + '" stroke-width="' + k + '"/><text x="' + l.x + '" y="' + (l.y + 4*k) + '" text-anchor="middle" font-size="' + 10.5*k + '" font-weight="600" fill="var(--ink)">' + esc(t) + '</text></g>');
      });
    }
    // nomes dos pinos
    const nameSvg = [];
    if (showNames){
      const order = cfg.pts.map((_, i) => i).sort((a, b) => (b === sel) - (a === sel));
      order.forEach(i => {

  function fit(){ C = null; vb = {x:0, y:0, w:W, h:H}; }

function bkInfo(b){
  const r = b.regra, done = !!DONE['bk:' + b.id];
  let date = null, label = '', big = '', small = '', cls = '', sortKey = 0, group = 'datado';
  if (r.k === 'agora'){ big = 'Já'; small = 'agora'; label = 'Fazer agora'; cls = 'urgent'; group = 'agora'; }
  else if (r.k === 'monitorar'){ big = '···'; small = 'vigiar'; label = r.t; cls = 'urgent'; group = 'agora'; }
  else if (r.k === 'aberto'){ big = '–'; small = 'a definir'; label = r.t; group = 'aberto'; }
  else {
    if (r.k === 'ate') date = D(r.date);
    else date = addD(D(b.visit), -r.dias);
    const n = diffD(date, TODAY);
    big = dd(date); small = MES[date.getUTCMonth()] + (date.getUTCFullYear() !== TODAY.getUTCFullYear() ? ' ' + String(date.getUTCFullYear()).slice(2) : '');
    if (r.k === 'antes'){
      if (n <= 0){ label = 'Já aberto: reserve agora'; cls = 'open'; }
      else { label = 'Abre em ' + n + (n === 1 ? ' dia' : ' dias') + (r.est ? ' (estimado)' : ''); cls = n <= 45 ? 'soon' : ''; }
    } else if (r.k === 'flex'){
      if (n <= 0){ label = 'Pode reservar agora'; cls = 'open'; }
      else { label = 'Reservar em ' + n + (n === 1 ? ' dia' : ' dias') + ' (recomendado)'; cls = n <= 45 ? 'soon' : ''; }
    } else {
      if (n < 0){ label = 'Prazo passou'; cls = 'urgent'; } else { label = 'Fazer em até ' + n + ' dias'; cls = n <= 45 ? 'soon' : ''; }
    }
    sortKey = date.getTime();
  }
  if (done) cls = 'isdone';
  return {date, label, big, small, cls, sortKey, group, done};
}
function bkSorted(list){
  const ord = {agora:0, datado:1, aberto:2};
  return list.map(b => ({b, i:bkInfo(b)})).sort((x, y) => ord[x.i.group] - ord[y.i.group] || x.i.sortKey - y.i.sortKey || (x.b.prio === 'alta' ? -1 : 1));

  const keys = ['roma','florenca','milao','interlaken','paris'];
  const rows = keys.map(k => { const s = STAYS[k], c = CITIES[k], n = s.out ? diffD(D(s.out), D(s.in)) : null; return '<tr><td><b>' + c.nome + '</b></td><td class="num">' + fmtW(D(s.in)) + '</td><td class="num">' + (s.out ? fmtW(D(s.out)) : 'a definir') + '</td><td class="num">' + (n ? n : '–') + '</td><td>' + esc(s.zona) + '</td></tr>'; }).join('');
  view.innerHTML = '<section><h2 class="sec-t">Onde ficar</h2><p class="sub-t">Cada zona foi pensada para os trens e passeios do seu roteiro. Reserve com cancelamento gratuito e acompanhe os preços.</p></section>' +
   '<section class="card"><div class="scroll-x"><table class="tbl"><thead><tr><th>Cidade</th><th>Entrada</th><th>Saída</th><th>Noites</th><th>Zona sugerida</th></tr></thead><tbody>' + rows + '</tbody></table></div><p class="small muted" style="margin-top:8px">Total até Paris: 10 noites (4 em Roma, 1 em Florença, 2 em Milão e 3 em Interlaken).</p></section>' +
   '<section class="grid g2">' + keys.map(k => { const s = STAYS[k], c = CITIES[k]; return '<div class="card" style="border-top:5px solid ' + colorOf(c) + '"><h3>' + c.nome + ' · ' + esc(s.zona) + '</h3><ul style="margin:0 0 8px;padding-left:18px">' + s.por.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' + (s.hoteis.length ? '<p class="small muted">Para pesquisar: ' + s.hoteis.map(h => '<b>' + esc(h[0]) + '</b>').join(', ') + '.</p>' : '') + '<p class="small" style="margin-top:6px"><b>Cuidado:</b> ' + esc(s.evitar) + '</p><div class="row" style="margin-top:10px"><button class="btn" data-go="' + k + '" data-itab="stay">Ver mapa e distâncias</button></div></div>'; }).join('') + '</section>' +
   '<section class="card"><h3>Dicas para reservar hotel</h3><div class="tip"><span class="chip acc">Cancelamento</span><p>Prefira tarifas com cancelamento gratuito até poucos dias antes. Se o preço cair, cancele e reserve de novo.</p></div><div class="tip"><span class="chip acc">Bagagem</span><p>Pergunte se há elevador e guarda-volumes. Em Roma, Florença e Milão, muitos prédios históricos têm escadas.</p></div><div class="tip"><span class="chip acc">Taxa local</span><p>Itália e Suíça cobram uma taxa de permanência por noite, normalmente paga no hotel e não incluída no valor.</p></div><div class="tip"><span class="chip acc">Chegadas e saídas</span><p>Informe o horário de chegada: em Florença e Milão você chega à noite, e em Roma por volta das 13h.</p></div></section>';
}

// ===== dicas gerais =====
function renderDicas(){
  view.innerHTML = '<section><h2 class="sec-t">Dicas e documentos</h2><p class="sub-t">O que conferir antes de embarcar e o que ajuda no dia a dia.</p></section>' +
   '<section class="grid g2">' + GERAL.map(g => '<div class="card"><h3>' + g.t + '</h3>' + g.i.map(i => '<div class="tip"><span class="chip acc">' + esc(i[0]) + '</span><p>' + esc(i[1]) + '</p></div>').join('') + '</div>').join('') + '</section>' +
   '<section class="card"><h3>Frases úteis</h3><div class="scroll-x"><table class="tbl"><thead><tr><th>Português</th><th>Italiano</th><th>Alemão</th><th>Francês</th></tr></thead><tbody>' + FRASES.map(f => '<tr>' + f.map((x, i) => '<td' + (i === 0 ? ' class="muted"' : '') + '>' + esc(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div></section>';
}
function renderMala(){
  const total = MALA.reduce((s, g) => s + g.i.length, 0), feitos = MALA.reduce((s, g, gi) => s + g.i.filter((_, ii) => DONE['ml:' + gi + ':' + ii]).length, 0);
  view.innerHTML = '<section><h2 class="sec-t">Checklist</h2><p class="sub-t"><b>' + feitos + ' de ' + total + '</b> itens marcados. A seleção fica salva neste navegador.</p><div class="prog"><div style="width:' + Math.round(feitos/total*100) + '%"></div></div></section>' +
   '<section class="grid g3">' + MALA.map((g, gi) => '<div class="card"><h3>' + g.t + '</h3><ul class="cklist">' + g.i.map((x, ii) => '<li class="' + (DONE['ml:' + gi + ':' + ii] ? 'on' : '') + '"><label><input type="checkbox" data-ck="ml:' + gi + ':' + ii + '"><span>' + esc(x) + '</span></label></li>').join('') + '</ul></div>').join('') + '</section>';
}
function renderAtencao(){
  const ord = {alta:0, media:1, baixa:2}, lbl = {alta:'Alta', media:'Média', baixa:'Baixa'};
  view.innerHTML = '<section><h2 class="sec-t">Pontos de atenção na sua planilha</h2><p class="sub-t">Inconsistências e riscos que encontrei ao cruzar o roteiro com horários e regras de funcionamento. Nada foi alterado no roteiro: são sugestões para você decidir.</p></section>' +
   '<section class="grid" style="gap:12px">' + [...ATENCAO].sort((a, b) => ord[a.sev] - ord[b.sev]).map(a => '<div class="alert ' + (a.sev === 'alta' ? 'high' : '') + '"><div class="row"><span class="chip ' + (a.sev === 'alta' ? 'dan' : a.sev === 'media' ? 'warn' : '') + '">Prioridade ' + lbl[a.sev] + '</span></div><h4 style="margin-top:6px">' + esc(a.t) + '</h4><p>' + esc(a.txt) + '</p><p style="margin-top:6px"><b>Sugestão:</b> ' + esc(a.sug) + '</p></div>').join('') + '</section>';
}

// ===== eventos =====
document.addEventListener('click', e => {
  const t = e.target;
  let el;
  if ((el = t.closest('[data-go]'))){
    const id = el.dataset.go; const opt = {};
    if (el.dataset.day != null) opt.day = +el.dataset.day; if (el.dataset.itab) opt.itab = el.dataset.itab;
    go(id, opt); return;
  }
  if ((el = t.closest('[data-day]')) && el.closest('.daytabs')){ const c = CITIES[S.tab]; S.city[S.tab].day = +el.dataset.day; $$('.daytabs button').forEach(b => b.setAttribute('aria-selected', b === el)); mountDay(c, S.city[S.tab].day); syncChecks(); return; }
  if ((el = t.closest('[data-itab]')) && el.closest('.inner')){ S.city[S.tab].tab = el.dataset.itab; $$('.inner button[data-itab]').forEach(b => b.setAttribute('aria-selected', b === el)); mountITab(CITIES[S.tab], el.dataset.itab); return; }
  if ((el = t.closest('.tag-bk'))){
    const id = el.dataset.bk; const b = BOOKINGS.find(x => x.id === id); if (!b) return;
    const city = Object.keys(NOMES_CIDADE).find(k => NOMES_CIDADE[k] === b.cidade);
    if (CITIES[S.tab] && city === S.tab){ S.city[S.tab].tab = 'res'; $$('.inner button[data-itab]').forEach(x => x.setAttribute('aria-selected', x.dataset.itab === 'res')); mountITab(CITIES[S.tab], 'res'); const card = $('#bk-' + id); if (card) card.scrollIntoView({block:'center', behavior:'smooth'}); return; }
    S.res.cidade = ''; S.res.cat = ''; S.res.date = null; go('reservas'); setTimeout(() => { const c = $('#bk-' + id); if (c) c.scrollIntoView({block:'center', behavior:'smooth'}); }, 60); return;
  }
  if ((el = t.closest('.it')) && !t.closest('a,button,input,label')){ const i = +el.dataset.i; const box = $('#daybox'); selectItem(i, false); if (MAP && box && box._B){ const pi = box._B.itemPins[i][0]; if (pi != null) MAP.select(pi, true); } return; }
  if ((el = t.closest('[data-hop]')) && el.tagName === 'TR'){ const i = +el.dataset.hop; $$('.legs tr', view).forEach(r => r.classList.toggle('on', r === el)); MAP && MAP.selectHop(i); return; }
  if ((el = t.closest('[data-rv]'))){ S.res.view = el.dataset.rv; renderReservas(); syncChecks(); return; }
  if ((el = t.closest('[data-cal]'))){ S.res.date = S.res.date === el.dataset.cal ? null : el.dataset.cal; renderReservas(); syncChecks(); return; }
  if ((el = t.closest('[data-calclear]'))){ S.res.date = null; renderReservas(); syncChecks(); return; }
  if ((el = t.closest('[data-pday]'))){ S.parisSel = +el.dataset.pday; mountBuilder(); return; }
  if (t.closest('[data-padd]')){ PAR.days.push({ids:[], note:''}); S.parisSel = PAR.days.length-1; parisSave(); mountBuilder(); return; }
  if (t.closest('[data-pdel]')){ PAR.days.pop(); S.parisSel = Math.min(S.parisSel, PAR.days.length-1); parisSave(); mountBuilder(); return; }
  if ((el = t.closest('[data-pcat]'))){ PCAT = el.dataset.pcat; mountBuilder(); return; }
  if ((el = t.closest('[data-ptoggle]'))){ parisToggle(el.dataset.ptoggle); return; }
  if ((el = t.closest('[data-prem]'))){ parisToggle(el.dataset.prem); return; }
  if ((el = t.closest('[data-pmove]'))){ const [n, d] = el.dataset.pmove.split(':').map(Number); const ids = PAR.days[S.parisSel].ids; const m = n + d; if (m >= 0 && m < ids.length){ [ids[n], ids[m]] = [ids[m], ids[n]]; parisSave(); mountBuilder(); } return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.ck){ setDone(t.dataset.ck, t.checked); if (S.tab === 'reservas') { renderReservas(); syncChecks(); } else if (S.tab === 'mala') { renderMala(); syncChecks(); } else syncChecks(); if (t.dataset.ck.startsWith('bk:') && t.checked) toast('Marcado como feito'); return; }
  if (t.id === 'fc'){ S.res.cidade = t.value; renderReservas(); syncChecks(); }
  if (t.id === 'ft'){ S.res.cat = t.value; renderReservas(); syncChecks(); }
  if (t.id === 'fp'){ S.res.pend = t.checked; renderReservas(); syncChecks(); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('it')){ e.preventDefault(); e.target.click(); } });
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nx); store.set('theme', nx);
  if (MAP) MAP.redraw(); if (MAP2) MAP2.redraw();
});
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== S.tab && validTab(id)){ S.tab = id; render(); window.scrollTo(0, 0); } });
function validTab(id){ return GRUPOS.some(g => g.subs.some(s => s[0] === id)); }

// ===== início =====
(function init(){
  const th = store.get('theme', null); if (th) document.documentElement.setAttribute('data-theme', th);
  const dias = diffD(TRIP_START, TODAY);
  $('#cd').textContent = dias > 0 ? 'Faltam ' + dias + ' dias' : dias >= -10 ? 'Em viagem' : 'Viagem concluída';
  let id = ''; try { id = location.hash.slice(1); } catch(e){}
  S.tab = validTab(id) ? id : 'geral';
  render();
})();
</script>

</body></html>
